[package]
name = "terminarium"
version = "0.1.0"
edition = "2021"

[dependencies]
crossterm = "0.29"
ratatui = "0.30.2"
# Local wall-clock hour only, to pick the time-of-day palette. No serde/oldtime.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# A deterministic economy must fail loudly rather than wrap silently.
[profile.release]
overflow-checks = true
