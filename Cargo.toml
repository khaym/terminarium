[package]
# Working name — the game is unnamed yet (naming is out of scope of the first
# slice); rename the package when the name is decided.
name = "tui-game"
version = "0.1.0"
edition = "2021"

[dependencies]
crossterm = "0.29"
ratatui = "0.30.2"
# Local wall-clock hour only, to pick the time-of-day palette. No serde/oldtime.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# A deterministic economy must fail loudly rather than wrap silently.
[profile.release]
overflow-checks = true
